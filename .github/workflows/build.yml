name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore opti-pdf.csproj -PackagesDirectory packages

      - name: Build (Release)
        run: msbuild opti-pdf.csproj /p:Configuration=Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: opti-pdf
          path: bin/Release
