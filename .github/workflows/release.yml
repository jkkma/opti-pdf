name: Release

# Push a tag that matches the version in Properties/AssemblyInfo.cs:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# build-release.ps1 refuses to build if the two disagree, so bump
# AssemblyVersion/AssemblyFileVersion first.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0. Defaults to AssemblyInfo.cs.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) { exit 0 }
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { exit 0 }
          choco install innosetup --no-progress --yes

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = $env:INPUT_VERSION
          }
          Write-Host "version=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:VERSION) {
            .\scripts\build-release.ps1 -Version $env:VERSION
          } else {
            .\scripts\build-release.ps1
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: opti-pdf-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' }
          if (-not $files) { throw 'No artifacts found in dist.' }

          $ghArgs = @('release', 'create', $env:TAG, '--title', $env:TAG, '--generate-notes')
          # A tag like v1.1.0-rc1 ships as a pre-release.
          if ($env:TAG -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += $files.FullName

          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }
