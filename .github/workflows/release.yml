name: Release

# Two ways to cut a release, both ending in the same GitHub Release:
#
#   1. Push a tag:  git tag v1.0.0 && git push origin v1.0.0
#   2. Run this workflow manually from the Actions tab. It tags the commit it
#      built, which is also the way to release without tag-push rights.
#
# Either way the version comes from Properties/AssemblyInfo.cs and
# build-release.ps1 refuses to build if a passed version disagrees with it, so
# bump AssemblyVersion/AssemblyFileVersion first.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0. Defaults to AssemblyInfo.cs.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) { exit 0 }
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { exit 0 }
          choco install innosetup --no-progress --yes

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = $env:INPUT_VERSION
          }
          Write-Host "version=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:VERSION) {
            .\scripts\build-release.ps1 -Version $env:VERSION
          } else {
            .\scripts\build-release.ps1
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: opti-pdf-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          SHA: ${{ github.sha }}
        run: |
          $files = @(Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' })
          if (-not $files) { throw 'No artifacts found in dist.' }

          # Take the version from the artifact that was actually built rather
          # than re-deriving it, so the tag can never name a different version
          # than the installer inside the release.
          $setup = $files | Where-Object { $_.Name -like '*-setup.exe' } | Select-Object -First 1
          if (-not $setup) { throw 'No installer found in dist.' }
          if ($setup.Name -notmatch '^opti-pdf-(.+)-setup\.exe$') {
            throw "Cannot read a version out of $($setup.Name)."
          }
          # Capture before any other -match resets $Matches.
          $version = $Matches[1]
          $tag = "v$version"
          Write-Host "Publishing $tag"

          $ghArgs = @('release', 'create', $tag, '--title', $tag, '--generate-notes')
          # A version like 1.1.0-rc1 ships as a pre-release.
          if ($version -match '-') { $ghArgs += '--prerelease' }
          # On a manual run no tag exists yet; create it on the built commit.
          if ($env:IS_TAG -ne 'true') { $ghArgs += @('--target', $env:SHA) }
          $ghArgs += $files.FullName

          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }
